plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.140'
}

version = mod_version
group = "io.siuolplex"

repositories {
    mavenLocal()
    //Mainly for pmd
    mavenCentral()

    maven {
        name = "blamejared"
        url = "https://maven.blamejared.com"
    }

    maven { url "https://maven.shedaniel.me/" }

    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com"
        content {
            includeModule("com.terraformersmc", "biolith-neoforge")
            includeModule("dev.emi", "emi-neoforge")
        }
    }

    maven {
        name = "TheIllusiveC4"
        url = "https://maven.theillusivec4.top/"
        content {
            includeGroup("top.theillusivec4.curios")
        }
    }

    maven {
        name = "Create"
        url = uri("https://maven.createmod.net")
    }

    maven {
        url "https://maven.squiddev.cc"
        content {
            includeGroup("cc.tweaked")
        }
    }

    maven {
        url "https://dl.cloudsmith.io/public/klikli-dev/mods/maven/"
        content {
            includeGroup "com.klikli_dev"
        }
    }

    maven {
        name = "cursemaven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup("curse.maven")
        }
    }

    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup("maven.modrinth")
        }
    }

    maven {
        name = "Jitpack"
        url = "https://jitpack.io"
        content {
            includeGroupByRegex("com\\.github\\..*")
        }
    }

    maven {
        name = "RyanHCode Maven"
        url = "https://maven.ryanhcode.dev/releases"
        content {
            includeGroupAndSubgroups("dev.ryanhcode")
        }
    }

    maven { url = "https://mvn.devos.one/snapshots"}


        //K4Unl's mirror of other modding-related mavens, in case they are down.
    //Should be checked last; should **not** be the primary source for any artifact.
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev/"
        content {
            //includeGroup("org.violetmoon.quark")
            includeGroup("org.violetmoon.zeta")
            includeGroup("mezz.jei")
//            includeModule("com.terraformersmc", "biolith-neoforge") //Not mirrored
            includeModule("net.fabricmc", "sponge-mixin")
            includeGroup("top.theillusivec4.curios")
//            includeGroup("net.createmod.ponder") //Not mirrored
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }


dependencies {
    // Todo:

    implementation("dev.emi:emi-neoforge:${emi_version}")

    // No Mans Land
    implementation("org.violetmoon.quark:Quark:${quark_version}-SNAPSHOT") {
        setChanging(true)
    }
    implementation("org.violetmoon.zeta:Zeta:${zeta_version}-SNAPSHOT") {
        setChanging(true)
    }
    implementation("com.terraformersmc:biolith-neoforge:${biolith_version}"){transitive=false}

    implementation("maven.modrinth:databank:${databank_version}") // Where is their real maven? Should this be local maven instead?
    implementation("maven.modrinth:pastel-mod:${pastel_version}")
    implementation("me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}")

    implementation("com.klikli_dev:modonomicon-${minecraft_version}-neoforge:${modonomicon_version}")

    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    implementation("maven.modrinth:create-aeronautics:${aeronautics_version}+mc${minecraft_version}") { transitive = false }
    implementation("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}")
    implementation("foundry.veil:veil-neoforge-${minecraft_version}:${veil_version}") {
        exclude group: "maven.modrinth"
        exclude group: "me.fallenbreath"
    }
    // Farmer's Delight
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [mod_version : mod_version]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
